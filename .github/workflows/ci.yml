name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment) so a mutable-tag compromise cannot inject code into CI. Dependabot
# (.github/dependabot.yml, github-actions ecosystem) PRs the pins forward.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --locked
      - name: Discover paired LAN worker and dispatch over QUIC
        if: runner.os == 'Linux'
        run: cargo test --locked -p entangle-bin --test daemon_compute -- --ignored --exact discovers_and_runs_work_without_a_configured_peer_address

  build-wasm:
    name: build-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build, sign and execute the hello-world component
        run: cargo test --locked -p entangle-runtime --test hello_world_e2e -- --ignored
      - name: Scaffold a component and run the catalog quickstart
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          cargo test --locked -p entangle-cli --test authoring --test catalog -- --ignored
      - name: Test JSON Pointer conformance
        working-directory: plugins/json-pointer
        run: cargo test --locked
      - name: Verify signed WASI catalog workloads on the daemon
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build --locked -p entangle-cli -p entangle-bin
          python3 scripts/tests/live-publisher.py target/debug
          python3 -m venv target/catalog-smoke-python
          target/catalog-smoke-python/bin/pip install Pillow==12.2.0 zxing-cpp==2.3.0
          target/catalog-smoke-python/bin/python plugins/smoke_test.py target/debug/entangle target/debug/entangled --two-node

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.91"
          arguments: --all-features --locked
          command: check advisories bans licenses sources

  catalog-advisories:
    name: Plugin advisories (${{ matrix.plugin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: [compress, csv-stats, image-resize, json-pointer, json-query, markdown-html, qr-encode]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.91"
          manifest-path: ./plugins/${{ matrix.plugin }}/Cargo.toml
          arguments: --locked
          command: check advisories
          command-arguments: --config deny.toml

  docs:
    name: docs
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo doc --workspace --locked --no-deps

  docker-build:
    name: docker-build (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Smoke test: the build context is the repo ROOT (per docker/README.md),
      # which exercises the root .dockerignore. This catches Dockerfile / context
      # regressions without publishing anything.
      - name: Build daemon image (smoke test)
        run: docker build -f docker/Dockerfile .
