name: Bus Factor Check

# ATC-BUS-1 (INV-BUS-1, spec 12.1): every role has at least 2 active holders,
# where active = at least one merge in the trailing 60 days. The logic lives in
# `cargo xtask bus-factor` (tools/xtask/src/governance.rs), which is covered by
# tests; this workflow only runs it and opens the P0 issue on failure.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  invariant_check:
    name: bus-factor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # git log --merges needs history

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check role coverage
        id: check
        continue-on-error: true
        run: cargo xtask bus-factor --report "${RUNNER_TEMP}/bus-factor-body.md"

      - name: Open P0 issue on violation
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="P0: Bus Factor Violation — role coverage below minimum (INV-BUS-1)"
          body="${RUNNER_TEMP}/bus-factor-body.md"
          # The report is only written for policy violations; a tooling error
          # (git failure, unparsable roles.toml) leaves none, and the issue must
          # still be filed.
          if [ ! -s "${RUNNER_TEMP}/bus-factor-body.md" ]; then
            {
              echo "The weekly bus-factor check failed without producing a report"
              echo "(a tooling error, not necessarily a coverage gap)."
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "$body"
          fi
          gh label create P0 --color B60205 \
            --description "Release-blocking invariant violation" 2>/dev/null || true
          # Tolerate only a genuine duplicate; any other gh failure fails the job.
          existing=$(gh issue list --label P0 --state open --search "Bus Factor Violation in:title" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An open P0 bus-factor issue already exists; not opening another."
          else
            gh issue create --title "$title" --label "P0" --body-file "$body"
          fi

      - name: Fail on violation
        if: steps.check.outcome == 'failure'
        run: |
          echo "Bus factor check failed — see the P0 issue for details."
          exit 1
