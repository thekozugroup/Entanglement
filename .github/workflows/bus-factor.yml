name: Bus Factor Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  bus-factor:
    name: bus-factor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check role coverage
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if result=$(python3 scripts/check-release-governance.py --bus-factor-only 2>&1); then
            echo "violation=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "violation=true"
              echo "violation_body<<BUS_FACTOR_BODY"
              echo '## P0: Bus factor check failed (INV-BUS-1)'
              echo
              printf '%s\n' "$result"
              echo
              echo 'See architecture §12.1 for active maintainer requirements.'
              echo 'BUS_FACTOR_BODY'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open P0 issue on violation
        if: steps.check.outputs.violation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIOLATION_BODY: ${{ steps.check.outputs.violation_body }}
        run: |
          printf '%s\n' "${VIOLATION_BODY}" > /tmp/bus-factor-body.md
          gh issue create \
            --title "P0: Bus Factor Violation — role coverage below minimum (INV-BUS-1)" \
            --label "P0" \
            --body-file /tmp/bus-factor-body.md \
            || echo "Issue may already exist; check open issues."

      - name: Fail on violation
        if: steps.check.outputs.violation == 'true'
        run: |
          echo "Bus factor check failed — see issue for details."
          exit 1
