name: Bus Factor Check

# ATC-BUS-1 (INV-BUS-1, spec 12.1): every role has at least 2 active holders,
# where active = at least one merge in the trailing 60 days. The logic lives in
# `cargo xtask bus-factor` (tools/xtask/src/governance.rs), which is covered by
# tests; this workflow only runs it and opens the P0 issue on failure.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  invariant_check:
    name: bus-factor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # git log --merges needs history

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: tools/xtask

      - name: Check role coverage
        id: check
        continue-on-error: true
        run: cargo xtask bus-factor --report "${RUNNER_TEMP}/bus-factor-body.md"

      - name: Open P0 issue on violation
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "P0: Bus Factor Violation — role coverage below minimum (INV-BUS-1)" \
            --label "P0" \
            --body-file "${RUNNER_TEMP}/bus-factor-body.md" \
            || echo "Issue may already exist; check open issues."

      - name: Fail on violation
        if: steps.check.outcome == 'failure'
        run: |
          echo "Bus factor check failed — see the P0 issue for details."
          exit 1
