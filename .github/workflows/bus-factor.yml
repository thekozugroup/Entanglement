name: Bus Factor Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  bus-factor:
    name: bus-factor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check role coverage
        id: check
        env:
          ROLES_FILE: docs/maintainers/roles.toml
        run: |
          # Parse the roster with a real TOML parser (tomllib, stdlib on the
          # Python 3.11+ that ships with ubuntu-24.04). The schema is:
          #     [role.<name>]
          #     holders = ["handle", ...]
          # INV-BUS-1 (spec §12.1) requires >= 2 holders per role.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import tomllib

          roles = [
              "core-runtime-lead",
              "mesh-lead",
              "agent-lead",
              "security-lead",
              "release-lead",
          ]

          path = os.environ["ROLES_FILE"]
          data = None
          if os.path.exists(path):
              with open(path, "rb") as fh:
                  data = tomllib.load(fh)

          violations = []
          for role in roles:
              if data is None:
                  violations.append(f"{role}: 0 holders (file missing)")
                  continue
              holders = data.get("role", {}).get(role, {}).get("holders", []) or []
              count = len(holders)
              if count < 2:
                  violations.append(f"{role}: {count} active holder(s) (need >= 2)")

          if violations:
              print("violation=true")
              print("violation_body<<BODY")
              print("## P0: Bus Factor Violation (INV-BUS-1)")
              print("")
              print("The following roles have fewer than 2 active holders:")
              print("")
              for item in violations:
                  print(f"- {item}")
              print("")
              print(
                  "**Required action**: Add active holders to "
                  "`docs/maintainers/roles.toml` and update `.github/CODEOWNERS`."
              )
              print("")
              print("See spec section 12.1 INV-BUS-1 for requirements.")
              print("BODY")
          else:
              print("violation=false")
          PY

      - name: Open P0 issue on violation
        if: steps.check.outputs.violation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIOLATION_BODY: ${{ steps.check.outputs.violation_body }}
        run: |
          printf '%s\n' "${VIOLATION_BODY}" > /tmp/bus-factor-body.md
          gh issue create \
            --title "P0: Bus Factor Violation — role coverage below minimum (INV-BUS-1)" \
            --label "P0" \
            --body-file /tmp/bus-factor-body.md \
            || echo "Issue may already exist; check open issues."

      - name: Fail on violation
        if: steps.check.outputs.violation == 'true'
        run: |
          echo "Bus factor check failed — see issue for details."
          exit 1
