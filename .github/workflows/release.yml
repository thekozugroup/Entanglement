name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. v0.1.0). Defaults to the latest tag reachable from the selected ref."
        required: false
        default: ""
      staged_run:
        description: "Successful tag-push workflow run ID to promote. Leave blank to package only."
        required: false
        default: ""
      publisher_signatures:
        description: "JSON object mapping each target triple to its external Ed25519 signature in hex."
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

# All third-party actions are pinned to a full commit SHA (trailing version
# comment). This job graph holds `id-token: write` for keyless cosign signing,
# so a mutable-tag compromise could publish tampered *signed* tarballs — pinning
# removes that vector. Dependabot (github-actions ecosystem) forwards the pins.
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build + package on each platform
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    if: github.event_name != 'workflow_dispatch' || inputs.staged_run == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout tagged source and determine version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --abbrev=0)
          fi

          # The installer reconstructs the asset name from a release tag.
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '${VERSION}' is not an installable vX.Y.Z release tag" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git checkout --detach "refs/tags/${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
          targets: wasm32-wasip2, ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install b3sum (for the BLAKE3 sidecar)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y b3sum
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install b3sum
          fi

      - name: Build release binaries
        run: cargo build --release --workspace --bins --locked --target ${{ matrix.target }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run signed catalog workloads on the native release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 -m venv target/native-workload-python
          target/native-workload-python/bin/pip install Pillow==12.2.0 zxing-cpp==2.3.0
          target/native-workload-python/bin/python scripts/tests/native-release.py "$TARGET" "target/$TARGET/release" target/native-workload.json

      - name: Retain native workload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-workload-${{ matrix.target }}
          path: target/native-workload.json
          if-no-files-found: error

      - name: Compute checksums and package tarball
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/tests/test_package_native_release.py
          # Use the checked-out tag's commit time for the tar and gzip headers.
          SOURCE_DATE_EPOCH="$(git log -1 --no-show-signature --format=%ct HEAD)"
          TARBALL="$(python3 scripts/package-native-release.py --version "${VERSION}" \
            --target "${TARGET}" --bin-dir "target/${TARGET}/release" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test unpacked native binaries
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "${HOST}" = "${TARGET}" ]; then
            EXTRACT="$(mktemp -d)"
            trap 'rm -rf "${EXTRACT}"' EXIT
            tar -xzf "${TARBALL}" -C "${EXTRACT}"
            for bin in entangled entangle; do
              actual="$("${EXTRACT}/${TARBALL%.tar.gz}/${bin}" --version)"
              if [ "${actual}" != "${bin} ${VERSION#v}" ]; then
                echo "::error::Unexpected version in ${TARBALL}: ${actual}" >&2
                exit 1
              fi
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            entanglement-*.tar.gz
            entanglement-*.tar.gz.sha256
            entanglement-*.tar.gz.b3
          if-no-files-found: error

  release-governance:
    name: Release governance
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.staged_run != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check active maintainers and rotation review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-governance.py

  release-ci:
    name: Validate tagged source
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Sigstore attestation + cosign signing
  # ─────────────────────────────────────────────────────────────────────────────
  sigstore-attest:
    name: Sigstore / SLSA attestation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-governance, release-ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # required for keyless OIDC signing
      attestations: write   # required for SLSA provenance

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3

      - name: SLSA provenance attestation (via actions/attest-build-provenance)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: "entanglement-*.tar.gz"

      - name: Cosign keyless sign-blob (one bundle per tarball)
        run: |
          for tarball in entanglement-*.tar.gz; do
            bundle="${tarball}.sigstore"
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${bundle}" \
              "${tarball}"
            echo "Signed ${tarball} -> ${bundle}"
          done

      - name: Upload sigstore bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigstore-bundles
          path: "entanglement-*.tar.gz.sigstore"
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Promote the exact staged archives after external publisher signing
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: release-governance
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.staged_run != ''
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm the staging run validated this tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RUN: ${{ inputs.staged_run }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$STAGED_RUN" =~ ^[0-9]+$ ]]; then
            echo '::error::Staging run ID must be numeric.' >&2
            exit 1
          fi
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$GITHUB_REF_NAME" ]; then
            echo '::error::Select the same tag as the staging run.' >&2
            exit 1
          fi
          if [ ! -s docs/governance/key-ceremony.md ]; then
            echo '::error::The documented release-key ceremony evidence is required for promotion.' >&2
            exit 1
          fi
          COMMIT=$(git rev-parse HEAD)
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq '.id')
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGED_RUN}" |
            jq -e --arg commit "$COMMIT" --argjson workflow "$WORKFLOW_ID" \
              '.workflow_id == $workflow and .head_sha == $commit and .event == "push" and .status == "completed" and .conclusion == "success"'

      - name: Download staged archives and checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staged_run }}
          pattern: release-*
          path: staged-release
          merge-multiple: true

      - name: Download staged Sigstore bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staged_run }}
          name: sigstore-bundles
          path: staged-release

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3

      - name: Install b3sum
        run: sudo apt-get update && sudo apt-get install -y b3sum

      - name: Verify publisher and tagged workflow signatures
        env:
          ENTANGLE_RELEASE_PUBLISHER_KEY: ${{ vars.ENTANGLE_RELEASE_PUBLISHER_KEY }}
          PUBLISHER_SIGNATURES: ${{ inputs.publisher_signatures }}
        run: python3 scripts/verify-release-promotion.py staged-release

      - name: Determine pre-release flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "${TAG}" | grep -qiE 'alpha|beta|rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Print the body of a `## [<heading>]` section, exclusive of the
          # heading itself and stopping at the next `## ` heading of any kind.
          # `index(... ) == 1` avoids regex-escaping the version's dots and does
          # not collapse to the heading line the way a naive awk range does.
          extract() {
            awk -v h="$1" '
              index($0, "## [" h "]") == 1 { flag = 1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md
          }
          NOTES="$(extract "${VER}")"
          if [ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]; then
            NOTES="$(extract "Unreleased")"
          fi
          if [ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            printf '%s\n' "${NOTES}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Entanglement ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            staged-release/entanglement-*.tar.gz
            staged-release/entanglement-*.tar.gz.sha256
            staged-release/entanglement-*.tar.gz.b3
            staged-release/entanglement-*.tar.gz.sig
            staged-release/entanglement-*.tar.gz.sigstore
          # Fail loudly if a pattern matched nothing. With `false`, a release
          # could publish while one platform's tarball was silently missing —
          # and scripts/install.sh resolves its download URL from the tag, so
          # users on that platform would get a bare 404 from an otherwise
          # "successful" release. A failed release job is far cheaper to fix.
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Publish the container after successful archive promotion
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Publish image (ghcr, multi-arch)
    needs: release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.staged_run != ''
    permissions:
      contents: read
      packages: write       # push to ghcr.io/<owner>/<repo>
      id-token: write       # provenance attestation for the image

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
