name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0) — leave blank to use latest git tag"
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

# All third-party actions are pinned to a full commit SHA (trailing version
# comment). This job graph holds `id-token: write` for keyless cosign signing,
# so a mutable-tag compromise could publish tampered *signed* tarballs — pinning
# removes that vector. Dependabot (github-actions ecosystem) forwards the pins.
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build + package on each platform
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no version tags)
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Configure aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Install b3sum (for the BLAKE3 sidecar)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y b3sum
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install b3sum
          fi

      - name: Determine version
        id: version
        env:
          # Move the workflow_dispatch input into an env var before use so it
          # cannot break out of the shell (script-injection hardening).
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi

          # VERSION becomes part of every published asset name
          # (entanglement-${VERSION}-${target}.tar.gz), and scripts/install.sh
          # reconstructs those names from a release tag. A version that is not a
          # clean `vX.Y.Z[-suffix]` tag — e.g. the `git describe` fallback's
          # `v0.1.0-3-gabc123-dirty` — yields assets no installer can address.
          # Publishing runs are gated on refs/tags/v*, so this only guards a
          # mistyped workflow_dispatch input or a future non-tag publish path.
          # The prerelease suffix deliberately excludes `-`, so a legitimate
          # `v1.2.3-rc1` passes while git-describe's `v0.1.0-3-gabc123-dirty`
          # (multiple dash-separated segments) is rejected.
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Version '${VERSION}' is not a vX.Y.Z release tag; assets built from it would not be installable." >&2
              exit 1
            fi
            echo "::warning::Version '${VERSION}' is a dev build; its assets are not installable via scripts/install.sh."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Binaries come out already stripped: the root Cargo.toml sets
      # `strip = "symbols"` on [profile.release], which rustc applies per target
      # (`--strip-all` via the linker for ELF, `strip -x` on Apple platforms).
      # The previous explicit per-target "Strip binaries" step was therefore
      # doing the work twice, and its `aarch64-linux-gnu-strip` invocation is no
      # longer needed for the cross build. (binutils-aarch64-linux-gnu is still
      # installed above — it also provides the `ar` used by AR_aarch64_*.)
      - name: Build release binaries
        run: cargo build --release --workspace --bins --locked --target ${{ matrix.target }}

      - name: Compute checksums and package tarball
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          BINDIR="target/${TARGET}/release"
          NAME="entanglement-${VERSION}-${TARGET}"
          TARBALL="${NAME}.tar.gz"

          # Stage into a clean top-level directory so the tarball extracts nicely
          # on both GNU tar (Linux) and BSD tar (macOS).
          STAGE="pkg/${NAME}"
          mkdir -p "${STAGE}"
          for bin in entangled entangle; do
            [ -f "${BINDIR}/${bin}" ] && cp "${BINDIR}/${bin}" "${STAGE}/"
          done
          for f in LICENSE README.md docs/architecture.md docs/tutorial.md; do
            [ -f "$f" ] && cp "$f" "${STAGE}/"
          done
          tar -czf "${TARBALL}" -C pkg "${NAME}"

          # SHA-256
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          else
            shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          fi

          # BLAKE3 sidecar (b3sum is installed above; skip gracefully if absent)
          if command -v b3sum >/dev/null 2>&1; then
            b3sum "${TARBALL}" > "${TARBALL}.b3"
          else
            echo "b3sum not available — skipping BLAKE3" >&2
          fi

          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            entanglement-*.tar.gz
            entanglement-*.tar.gz.sha256
            entanglement-*.tar.gz.b3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Sigstore attestation + cosign signing
  # ─────────────────────────────────────────────────────────────────────────────
  sigstore-attest:
    name: Sigstore / SLSA attestation
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # required for keyless OIDC signing
      attestations: write   # required for SLSA provenance

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: SLSA provenance attestation (via actions/attest-build-provenance)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: "entanglement-*.tar.gz"

      - name: Cosign keyless sign-blob (one bundle per tarball)
        run: |
          for tarball in entanglement-*.tar.gz; do
            bundle="${tarball}.sigstore"
            cosign sign-blob \
              --yes \
              --bundle "${bundle}" \
              "${tarball}"
            echo "Signed ${tarball} -> ${bundle}"
          done

      - name: Upload sigstore bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigstore-bundles
          path: "entanglement-*.tar.gz.sigstore"
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Create GitHub Release (tag pushes only)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: sigstore-attest
    runs-on: ubuntu-24.04
    # Only publish when a real tag was pushed (not manual dispatch without a tag)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # create GH release + upload assets
      id-token: write       # inherited for attestation context
      attestations: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Determine pre-release flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "${TAG}" | grep -qiE 'alpha|beta|rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Print the body of a `## [<heading>]` section, exclusive of the
          # heading itself and stopping at the next `## ` heading of any kind.
          # `index(... ) == 1` avoids regex-escaping the version's dots and does
          # not collapse to the heading line the way a naive awk range does.
          extract() {
            awk -v h="$1" '
              index($0, "## [" h "]") == 1 { flag = 1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md
          }
          NOTES="$(extract "${VER}")"
          if [ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]; then
            NOTES="$(extract "Unreleased")"
          fi
          if [ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            printf '%s\n' "${NOTES}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Entanglement ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            entanglement-*.tar.gz
            entanglement-*.tar.gz.sha256
            entanglement-*.tar.gz.b3
            entanglement-*.tar.gz.sigstore
          # Fail loudly if a pattern matched nothing. With `false`, a release
          # could publish while one platform's tarball was silently missing —
          # and scripts/install.sh resolves its download URL from the tag, so
          # users on that platform would get a bare 404 from an otherwise
          # "successful" release. A failed release job is far cheaper to fix.
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Publish multi-arch container image to GHCR (tag pushes only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Publish image (ghcr, multi-arch)
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write       # push to ghcr.io/<owner>/<repo>
      id-token: write       # provenance attestation for the image

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
