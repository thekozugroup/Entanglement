# Dependabot config.
# The github-actions ecosystem is what forwards the SHA pins in
# .github/workflows/*.yml: Dependabot resolves each pinned commit to the next
# release and opens a PR that updates both the SHA and its `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
