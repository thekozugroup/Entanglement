[workspace]
resolver = "2"
members = [
    "crates/entangle-types",
    "crates/entangle-manifest",
    "crates/entangle-signing",
    "crates/entangle-wit",
    "crates/entangle-host",
    "crates/entangle-broker",
    "crates/entangle-ipc",
    "crates/entangle-core",
    "crates/entangle-runtime",
    "crates/entangle-sdk",
    "crates/entangle-cli",
    "crates/entangle-bin",
    "crates/entangle-mesh-local",
    "crates/entangle-mesh-iroh",
    "crates/entangle-mesh-tailscale",
    "crates/entangle-oci",
    "tools/xtask",
    "crates/entangle-atc-matrix",
    "crates/entangle-rpc",
    "crates/entangle-peers",
    "crates/entangle-pairing",
    "crates/entangle-biscuits",
    "crates/entangle-scheduler",
    "crates/entangle-observability",
    "crates/entangle-agent-host",
    "crates/entangle-bench",
]
exclude = [
    "examples/*",
    "crates/entangle-host/fixtures-src/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/thekozugroup/Entanglement"
authors = ["thekozugroup <thekozugroup@gmail.com>"]
# Raised from 1.85 when the mesh transport landed: iroh 1.0 declares
# `rust-version = "1.91"`, so entangle-mesh-iroh — and therefore anything
# depending on it — cannot build on 1.85. rust-toolchain.toml already pins
# 1.91 and every CI job uses it, so 1.85 was an unverified claim that would
# only have failed for an outside consumer on an older toolchain.
rust-version = "1.91"

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Compression
flate2 = "1"

# Terminal detection
is-terminal = "0.4"

# Cryptography
ed25519-dalek = { version = "2", features = ["serde", "pkcs8", "pem", "rand_core"] }
blake3 = "1"
biscuit-auth = "6"
biscuit-quote = "0.3"
rand_core = "0.6"

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"

# Versioning / IDs
semver = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
tempfile = "3"

# Utilities
camino = "1"
async-trait = "0.1"
parking_lot = "0.12"
num_cpus = "1"

# WebAssembly
wasmtime = { version = "43.0.2", features = ["component-model"] }
wasmtime-wasi = "46.0.2"
wit-parser = "0.245"

# Networking
mdns-sd = "0.19"
# Iroh QUIC P2P transport (mesh.iroh, architecture.md §6.1).
#
# The 1.0 line, not the 0.95 line the scaffold's docs guessed at, for two
# reasons:
#   * 0.95.1 hard-pins `ed25519-dalek = "=3.0.0-pre.1"`, which no longer
#     compiles against the released `ed25519 3.0.0` support crate it floats
#     onto (`pkcs8::Error::KeyMalformed` changed from a unit to a tuple
#     variant). Fixing that needs an `=` pin on a transitive pre-release.
#     iroh 1.0 depends on `ed25519-dalek >=3.0.0-rc.0` and resolves onto the
#     released 3.0.0.
#   * 1.0 is the stable API; 0.95 is pre-1.0 churn.
#
# MSRV: iroh 1.0 declares `rust-version = "1.91"`. The workspace MSRV was
# raised from 1.85 to 1.91 to match (see `workspace.package.rust-version`
# above), so the declared floor is one this workspace actually builds on.
#
# `default-features = false` + `tls-ring` drops `metrics` and the aws-lc-rs
# crypto backend (ring builds faster and has no C toolchain requirement);
# `portmapper` is kept because NAT-PMP/PCP/UPnP port mapping is load-bearing
# for the WAN hole-punching this transport exists to do.
iroh = { version = "1.0", default-features = false, features = [
    "tls-ring",
    "portmapper",
] }

# CLI extras
directories = "5"
base64 = "0.22"
assert_cmd = "2"
predicates = "3"

# Meta-test tooling
walkdir = "2"
regex = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# First-party crates
entangle-types = { path = "crates/entangle-types" }
entangle-manifest = { path = "crates/entangle-manifest" }
entangle-signing = { path = "crates/entangle-signing" }
entangle-wit = { path = "crates/entangle-wit" }
entangle-host = { path = "crates/entangle-host" }
entangle-broker = { path = "crates/entangle-broker" }
entangle-ipc = { path = "crates/entangle-ipc" }
entangle-core = { path = "crates/entangle-core" }
entangle-runtime = { path = "crates/entangle-runtime" }
entangle-sdk = { path = "crates/entangle-sdk" }
entangle-mesh-local = { path = "crates/entangle-mesh-local" }
entangle-mesh-iroh = { path = "crates/entangle-mesh-iroh" }
entangle-oci = { path = "crates/entangle-oci" }
entangle-rpc = { path = "crates/entangle-rpc" }
entangle-peers = { path = "crates/entangle-peers" }
entangle-pairing = { path = "crates/entangle-pairing" }
entangle-biscuits = { path = "crates/entangle-biscuits" }
entangle-scheduler = { path = "crates/entangle-scheduler" }
entangle-observability = { path = "crates/entangle-observability" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Drop the symbol table and debug info from shipped binaries — the single
# biggest size win available here, since `lto`/`codegen-units` above were
# already in place. Tests are unaffected: `cargo test` builds under the
# `test`/`dev` profiles, not this one.
#
# Note that `[profile.bench]` inherits from this profile, so `cargo bench`
# binaries are stripped too. If you need symbol names for `perf`/flamegraph
# work on crates/entangle-bench, add `[profile.bench] strip = false` rather
# than weakening the setting here.
strip = "symbols"

# ---------------------------------------------------------------------------
# DO NOT change this to `panic = "abort"`.
#
# docs/architecture.md §2.1 ("Broker fault isolation") commits the core to
# running the capability broker on a dedicated tokio task with `catch_unwind`
# plus an outer supervisor, so that a broker panic becomes a *clean* non-zero
# exit that the service manager restarts, rather than an abrupt process kill.
# `catch_unwind` can only intercept a panic that unwinds; under `panic = "abort"`
# the process is terminated at the panic site and that entire fault-isolation
# design becomes unimplementable.
#
# The failure mode is silent, which is why this is spelled out here:
#   * `panic = "abort"` produces no compile error and no clippy warning;
#   * `cargo test` would still pass, because the `test` profile does not
#     inherit `profile.release` and always unwinds — so the test suite cannot
#     detect the regression;
#   * the breakage would only appear in a release daemon in production, as a
#     hard crash where a supervised restart was specified.
#
# `unwind` is already the compiler default; it is written out explicitly so the
# constraint is visible at exactly the line someone would otherwise "optimize".
# ---------------------------------------------------------------------------
panic = "unwind"

[profile.dev]
split-debuginfo = "unpacked"
