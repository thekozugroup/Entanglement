[package]
name = "entangle-bin"
description = "Daemon binary for the Entanglement plugin runtime (the `entangled` daemon)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "entangle_bin"
path = "src/lib.rs"

[[bin]]
name = "entangled"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
toml_edit = "0.22"
blake3 = { workspace = true }
rustix = { version = "1", features = ["fs"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
entangle-mesh-tailscale = { path = "../entangle-mesh-tailscale" }
entangle-types      = { workspace = true }
entangle-rpc        = { path = "../entangle-rpc" }
entangle-runtime    = { workspace = true }
entangle-signing    = { workspace = true }
entangle-manifest   = { workspace = true }
entangle-broker     = { workspace = true }
entangle-scheduler      = { path = "../entangle-scheduler" }
entangle-peers          = { path = "../entangle-peers" }
entangle-mesh-local     = { workspace = true }
entangle-mesh-iroh      = { workspace = true }
entangle-observability  = { workspace = true }
hex = { workspace = true }
num_cpus = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
flate2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
entangle-signing = { workspace = true }
entangle-peers   = { path = "../entangle-peers" }
entangle-mesh-iroh = { workspace = true }
serde_json       = { workspace = true }
