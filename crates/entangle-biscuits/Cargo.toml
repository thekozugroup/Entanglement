[package]
name = "entangle-biscuits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed capability tokens (biscuits) for cross-node authorization — spec §6.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
entangle-types   = { workspace = true }
# Read structured block facts from an already signature-verified authorizer snapshot.
biscuit-auth     = { workspace = true, features = ["unsafe-protobuf-access"] }
prost            = "0.14"
serde            = { workspace = true, features = ["derive"] }
thiserror        = { workspace = true }
hex              = { workspace = true }
ed25519-dalek    = { workspace = true }

[dev-dependencies]
rand_core = { workspace = true }
# NOTE: biscuit-quote is not needed since we use the string-based API
