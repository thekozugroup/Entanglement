[package]
name = "entangle-cli"
description = "CLI front-end for the Entanglement plugin runtime (the `entangle` command)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "entangle"
path = "src/main.rs"

[dependencies]
entangle-oci = { path = "../entangle-oci" }
entangle-mesh-tailscale = { path = "../entangle-mesh-tailscale" }
entangle-types     = { workspace = true }
entangle-runtime   = { workspace = true }
entangle-signing   = { workspace = true }
entangle-manifest  = { workspace = true }
entangle-rpc       = { path = "../entangle-rpc" }
entangle-peers     = { path = "../entangle-peers" }
entangle-pairing   = { path = "../entangle-pairing" }
entangle-scheduler     = { path = "../entangle-scheduler" }
entangle-observability = { workspace = true }
clap              = { workspace = true, features = ["derive"] }
clap_complete     = "4"
anyhow            = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs"] }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde             = { workspace = true, features = ["derive"] }
toml              = { workspace = true }
toml_edit         = "0.22"
directories       = "5"
hex               = { workspace = true }
base64            = { workspace = true }
blake3            = { workspace = true }
png               = "=0.18.1"
serde_json        = { workspace = true }
rand_core         = { workspace = true, features = ["getrandom"] }
argon2            = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305  = { version = "0.10", default-features = false, features = ["alloc"] }
rustix            = { version = "1", features = ["fs", "process"] }
tar.workspace     = true
zeroize           = "1"
dialoguer         = { workspace = true }
tempfile          = { workspace = true }

[dev-dependencies]
assert_cmd        = "2"
predicates        = "3"
entangle-signing  = { workspace = true }
entangle-pairing  = { path = "../entangle-pairing" }
hex               = { workspace = true }
serde_json        = { workspace = true }
