[package]
name = "entangle-cli"
description = "CLI front-end for the Entanglement plugin runtime (the `entangle` command)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "entangle"
path = "src/main.rs"

[dependencies]
entangle-types     = { workspace = true }
entangle-runtime   = { workspace = true }
entangle-signing   = { workspace = true }
entangle-oci       = { workspace = true }
entangle-manifest  = { workspace = true }
entangle-rpc       = { path = "../entangle-rpc" }
entangle-peers     = { path = "../entangle-peers" }
entangle-mesh-tailscale = { workspace = true }
entangle-pairing   = { path = "../entangle-pairing" }
entangle-scheduler     = { path = "../entangle-scheduler" }
# `compute stream` dials the executor itself (see cmd/compute_stream.rs).
# Already in the graph via entangle-scheduler: no new build cost.
entangle-mesh-iroh     = { workspace = true }
entangle-observability = { workspace = true, features = ["otlp"] }
entangle-agent-host    = { path = "../entangle-agent-host" }
camino            = { workspace = true }
clap              = { workspace = true, features = ["derive"] }
clap_complete     = "4"
anyhow            = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs"] }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde             = { workspace = true, features = ["derive"] }
toml              = { workspace = true }
toml_edit         = { workspace = true }
directories       = "5"
hex               = { workspace = true }
base64            = { workspace = true }
serde_json        = { workspace = true }
rand_core         = { workspace = true, features = ["getrandom"] }
dialoguer         = { workspace = true }
sha2              = { workspace = true }
blake3            = { workspace = true }
tempfile          = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix            = { workspace = true }

[dev-dependencies]
serde_yaml        = { workspace = true }
entangle-oci      = { workspace = true, features = ["testing"] }
tokio             = { workspace = true, features = ["full"] }
assert_cmd        = "2"
predicates        = "3"
entangle-signing  = { workspace = true }
entangle-pairing  = { path = "../entangle-pairing" }
hex               = { workspace = true }
serde_json        = { workspace = true }
entangle-bin      = { path = "../entangle-bin" }
entangle-broker   = { workspace = true }
