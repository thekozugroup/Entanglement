[workspace]
# Stand-alone plugin workspace.

[package]
name = "entangle-json-pointer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
entangle-sdk = { path = "../../crates/entangle-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
