[workspace]
# stand-alone — not a member of the Entanglement workspace.

[package]
name = "entangle-metric-numerical-l2-relative"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# A metric targets the `entangle:integrity@0.1.0` `metric-plugin` world, not
# the `plugin` world the SDK binds, so it uses wit-bindgen directly. The
# bindings only exist for the wasm build; the L2 math in `src/l2.rs` is
# plain Rust and is tested natively with `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
