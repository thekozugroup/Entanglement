[workspace]
# stand-alone — not a member of the Entanglement workspace.

[package]
name = "entangle-compress"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
entangle-sdk = { path = "../../crates/entangle-sdk" }
# `rust_backend` selects miniz_oxide (pure Rust). The default `zlib` C backend
# does not build for wasm32-wasip2.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
