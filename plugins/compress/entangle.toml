[plugin]
id = "PUBLISHER_PLACEHOLDER/compress@0.1.0"
version = "0.1.0"
tier = 1
runtime = "wasm"
description = "Round-trippable DEFLATE compression and decompression (gzip / zlib / raw) with a self-describing ENTZ container, CRC32 and length verification"

[capabilities]
# tier 1: pure compute. No filesystem, no network, no capability handles.

[build]
wit_world = "entangle:plugin@0.1.0/plugin"
target = "wasm32-wasip2"
