[workspace]

[package]
name = "stream-lines"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
